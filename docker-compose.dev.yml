name: nfx-vault-dev

# HTTP 入口只有 NFX-Edge（先启动 Edge：共享网络 nfx-edge + Traefik）。
# 本栈不跑 reverse-proxy。traefik.project 由 Edge LabelRegex 发现。
# Must start NFX-Edge first (creates nfx-edge). This stack has no reverse-proxy.

services:
  tls-base:
    image: nfx-vault-tls-base:dev
    container_name: NFX-Vault-Tls-Base-Dev
    build:
      context: .
      dockerfile: inputs/tls/configuration/Dockerfile.Base
      target: dev
    environment:
      - ENV=dev
      - CERTS_DIR=${CERTS_DIR}
      - ACME_CHALLENGE_DIR=${ACME_CHALLENGE_DIR}
    command: [ "air", "-c", "inputs/tls/base/.air.toml" ]
    expose:
      - "${HTTP_PORT}"
      - "${GRPC_PORT_TLS}"
    ports:
      - "${GRPC_PORT_TLS}:${GRPC_PORT_TLS}"
    labels:
      traefik.enable: "true"
      traefik.project: "nfx-vault"
      traefik.http.services.vault-tls-base.loadbalancer.server.port: "${HTTP_PORT}"
      traefik.http.routers.vault-tls-base.entrypoints: web
      traefik.http.routers.vault-tls-base.rule: Host(`${TRAEFIK_API_HOST}`) && PathPrefix(`${API_PREFIX_PATH_TLS}`)
      traefik.http.routers.vault-tls-base.service: vault-tls-base
      traefik.http.routers.vault-tls-base-secure.entrypoints: websecure
      traefik.http.routers.vault-tls-base-secure.rule: Host(`${TRAEFIK_API_HOST}`) && PathPrefix(`${API_PREFIX_PATH_TLS}`)
      traefik.http.routers.vault-tls-base-secure.service: vault-tls-base
      traefik.http.routers.vault-tls-base-secure.tls: "true"
    volumes:
      - ${CERTS_DIR}:${CERTS_DIR}:rw
      - ${ACME_CHALLENGE_DIR}:${ACME_CHALLENGE_DIR}:rw
      - ./errors/langs:/app/errors/langs
    develop:
      watch:
        - action: sync
          path: inputs/tls/base
          target: /app/inputs/tls/base
        - action: sync
          path: inputs/tls/configuration
          target: /app/inputs/tls/configuration
        - action: sync
          path: modules/tls
          target: /app/modules/tls
        - action: sync
          path: enums
          target: /app/enums
        - action: sync
          path: errors/src
          target: /app/errors/src
        - action: sync
          path: pkgs
          target: /app/pkgs
        - action: sync
          path: protos
          target: /app/protos
        - action: sync
          path: go.mod
          target: /app/go.mod
        - action: sync
          path: go.sum
          target: /app/go.sum
        - action: sync
          path: .env
          target: /app/.env
        - action: rebuild
          path: inputs/tls/configuration/Dockerfile.Base
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - nfx-vault
      - nfx-edge

  file-base:
