      traefik.http.routers.vault-analysis-base.rule: Host(`${TRAEFIK_API_HOST}`) && PathPrefix(`${API_PREFIX_PATH_ANALYSIS}`)
      traefik.http.routers.vault-analysis-base.service: vault-analysis-base
      traefik.http.routers.vault-analysis-base-secure.entrypoints: websecure
      traefik.http.routers.vault-analysis-base-secure.rule: Host(`${TRAEFIK_API_HOST}`) && PathPrefix(`${API_PREFIX_PATH_ANALYSIS}`)
      traefik.http.routers.vault-analysis-base-secure.service: vault-analysis-base
      traefik.http.routers.vault-analysis-base-secure.tls: "true"
    volumes:
      - ./errors/langs:/app/errors/langs
    develop:
      watch:
        - action: sync
          path: inputs/analysis/base
          target: /app/inputs/analysis/base
        - action: sync
          path: inputs/analysis/configuration
          target: /app/inputs/analysis/configuration
        - action: sync
