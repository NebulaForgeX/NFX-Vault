          target: /app/go.sum
        - action: sync
          path: .env
          target: /app/.env
        - action: rebuild
          path: inputs/file/configuration/Dockerfile.Base
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - nfx-vault
      - nfx-edge

