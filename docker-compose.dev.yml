      traefik.http.routers.vault-system-base.entrypoints: web
      traefik.http.routers.vault-system-base.rule: Host(`${TRAEFIK_API_HOST}`) && PathPrefix(`${API_PREFIX_PATH_SYSTEM}`)
      traefik.http.routers.vault-system-base.service: vault-system-base
      traefik.http.routers.vault-system-base-secure.entrypoints: websecure
      traefik.http.routers.vault-system-base-secure.rule: Host(`${TRAEFIK_API_HOST}`) && PathPrefix(`${API_PREFIX_PATH_SYSTEM}`)
      traefik.http.routers.vault-system-base-secure.service: vault-system-base
