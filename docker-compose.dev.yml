      traefik.http.routers.vault-file-base.service: vault-file-base
      traefik.http.routers.vault-file-base-secure.entrypoints: websecure
      traefik.http.routers.vault-file-base-secure.rule: Host(`${TRAEFIK_API_HOST}`) && PathPrefix(`${API_PREFIX_PATH_FILE}`)
      traefik.http.routers.vault-file-base-secure.service: vault-file-base
      traefik.http.routers.vault-file-base-secure.tls: "true"
    volumes:
