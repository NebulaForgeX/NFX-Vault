name: nfx-vault

# HTTP 入口只有 NFX-Edge（先启动 Edge：共享网络 nfx-edge + Traefik）。
# 本栈不跑 reverse-proxy。traefik.project 由 Edge LabelRegex 发现。
# Must start NFX-Edge first (creates nfx-edge). This stack has no reverse-proxy.

services:
  tls-api:
    image: nfx-vault-tls-api:prod
    container_name: NFX-Vault-Tls-Api
    build:
      context: .
      dockerfile: inputs/tls/api/Dockerfile
      target: prod
    environment:
      - ENV=prod
      - CERTS_DIR=${CERTS_DIR}
      - ACME_CHALLENGE_DIR=${ACME_CHALLENGE_DIR}
    expose:
      - "${HTTP_PORT}"
    labels:
      traefik.enable: "true"
      traefik.project: "nfx-vault"
      traefik.http.services.vault-tls-api.loadbalancer.server.port: "${HTTP_PORT}"
      traefik.http.routers.vault-tls-api.entrypoints: web
      traefik.http.routers.vault-tls-api.rule: Host(`${TRAEFIK_API_HOST}`) && PathPrefix(`/vault/tls`)
      traefik.http.routers.vault-tls-api.service: vault-tls-api
      traefik.http.routers.vault-tls-api-secure.entrypoints: websecure
      traefik.http.routers.vault-tls-api-secure.rule: Host(`${TRAEFIK_API_HOST}`) && PathPrefix(`/vault/tls`)
      traefik.http.routers.vault-tls-api-secure.service: vault-tls-api
      traefik.http.routers.vault-tls-api-secure.tls: "true"
      traefik.http.routers.vault-tls-acme.entrypoints: web
      traefik.http.routers.vault-tls-acme.rule: PathPrefix(`/.well-known/acme-challenge`)
      traefik.http.routers.vault-tls-acme.priority: "100"
      traefik.http.routers.vault-tls-acme.service: vault-tls-api

    volumes:
      - ${CERTS_DIR}:${CERTS_DIR}:rw
      - ${ACME_CHALLENGE_DIR}:${ACME_CHALLENGE_DIR}:rw
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - nfx-vault
      - nfx-edge
    restart: unless-stopped

  tls-connection:
    image: nfx-vault-tls-connection:prod
    container_name: NFX-Vault-Tls-Connection
    build:
      context: .
      dockerfile: inputs/tls/connection/Dockerfile
      target: prod
    environment:
      - ENV=prod
      - CERTS_DIR=${CERTS_DIR}
      - ACME_CHALLENGE_DIR=${ACME_CHALLENGE_DIR}
    expose:
      - "${HTTP_PORT}"
      - "${GRPC_PORT_TLS}"
    ports:
      - "${GRPC_PORT_TLS}:${GRPC_PORT_TLS}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - nfx-vault
    restart: unless-stopped

  tls-pipeline:
    image: nfx-vault-tls-pipeline:prod
    container_name: NFX-Vault-Tls-Pipeline
    build:
      context: .
      dockerfile: inputs/tls/pipeline/Dockerfile
      target: prod
    environment:
      - ENV=prod
      - CERTS_DIR=${CERTS_DIR}
      - ACME_CHALLENGE_DIR=${ACME_CHALLENGE_DIR}
    expose:
      - "${HTTP_PORT}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
