name: nfx-vault

services:
  reverse-proxy:
    image: traefik:latest
    container_name: NFX-Vault-Reverse-Proxy
    command:
      - --api.insecure=true
      - --providers.docker
      - --providers.docker.exposedByDefault=false
      - --providers.docker.constraints=Label(`traefik.project`, `nfx-vault`)
      - --entrypoints.web.address=:${TRAEFIK_HTTP_INTERNAL_PORT}
      - --entrypoints.websecure.address=:${TRAEFIK_HTTPS_INTERNAL_PORT}
      - --entrypoints.traefik.address=:${TRAEFIK_DASHBOARD_INTERNAL_PORT}
    ports:
      - "${TRAEFIK_HTTP_PORT}:${TRAEFIK_HTTP_INTERNAL_PORT}"
      - "${TRAEFIK_HTTPS_PORT}:${TRAEFIK_HTTPS_INTERNAL_PORT}"
      - "${TRAEFIK_DASHBOARD_PORT}:${TRAEFIK_DASHBOARD_INTERNAL_PORT}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${TRAEFIK_DYNAMIC_DIR}:/etc/traefik/dynamic:ro
      - ${CERTS_DIR}:/certs:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - nfx-vault
    restart: unless-stopped


  tls-api:
    image: nfx-vault-tls-api:prod
    container_name: NFX-Vault-Tls-Api
    build:
      context: .
      dockerfile: inputs/tls/api/Dockerfile
      target: prod
    environment:
      - ENV=prod
      - CERTS_DIR=${CERTS_DIR}
      - ACME_CHALLENGE_DIR=${ACME_CHALLENGE_DIR}
    expose:
      - "${HTTP_PORT}"
    labels:
      traefik.enable: "true"
      traefik.project: "nfx-vault"
      traefik.http.routers.tls-api.entrypoints: web
      traefik.http.routers.tls-api.rule: PathPrefix(`/vault/tls`)
      traefik.http.services.tls-api.loadbalancer.server.port: "${HTTP_PORT}"
      traefik.http.routers.tls-acme.entrypoints: web
      traefik.http.routers.tls-acme.rule: PathPrefix(`/.well-known/acme-challenge`)
      traefik.http.routers.tls-acme.priority: "100"
      traefik.http.routers.tls-acme.service: tls-api

    volumes:
      - ${CERTS_DIR}:${CERTS_DIR}:rw
      - ${ACME_CHALLENGE_DIR}:${ACME_CHALLENGE_DIR}:rw
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - nfx-vault
    restart: unless-stopped
    depends_on:
      reverse-proxy:
        condition: service_started

  tls-connection:
    image: nfx-vault-tls-connection:prod
    container_name: NFX-Vault-Tls-Connection
    build:
      context: .
      dockerfile: inputs/tls/connection/Dockerfile
      target: prod
    environment:
      - ENV=prod
      - CERTS_DIR=${CERTS_DIR}
      - ACME_CHALLENGE_DIR=${ACME_CHALLENGE_DIR}
    expose:
      - "${HTTP_PORT}"
      - "${GRPC_PORT_TLS}"
    ports:
      - "${GRPC_PORT_TLS}:${GRPC_PORT_TLS}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - nfx-vault
    restart: unless-stopped
    depends_on:
      reverse-proxy:
        condition: service_started

  tls-pipeline:
    image: nfx-vault-tls-pipeline:prod
    container_name: NFX-Vault-Tls-Pipeline
    build:
      context: .
      dockerfile: inputs/tls/pipeline/Dockerfile
      target: prod
    environment:
      - ENV=prod
      - CERTS_DIR=${CERTS_DIR}
      - ACME_CHALLENGE_DIR=${ACME_CHALLENGE_DIR}
    expose:
