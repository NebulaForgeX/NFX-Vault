# https://taskfile.dev
# 推荐用法：`task start` → 先选择 dev / secure（只问一次，导出 ENV）→ 再从菜单选指令。
# 所有与环境相关的任务都由 ENV（dev|secure）驱动。
#   - 交互入口：task start
#   - 直接执行：task run（默认 dev） | task atlas:pipeline:run ENV=secure -- --no-skip
# 平台 HTTP 入口在 NFX-Edge：先启动 Edge（共享网络 nfx-edge）。
# 需本地 Go/buf 的任务会先 source /volume1/Environments/use-menv.sh

version: "3"

vars:
  PROTO_SRC_DIR: protos
  PROTO_OUT_DIR: protos/gen
  GO_VERSION: "1.26.0"
  MODULE: "nfxvault"
  ERRORS_DIR: errors
  MESSAGES_DIR: messages
  ENV: '{{.ENV | default "dev"}}'
  ENV_FILE: '{{if eq .ENV "secure"}}.secure.env{{else}}.env{{end}}'
  NETWORK: "nfx-edge"
  APP_COMPOSE: '{{if eq .ENV "secure"}}docker-compose.yml{{else}}docker-compose.dev.yml{{end}}'
  POSTGRES_SSLMODE: "disable"

tasks:
  start:
    desc: "Interactive task menu — browse Taskfile tasks with ↑/↓ or w/s, Enter to run"
    cmds:
      - ./task.sh
    interactive: true

  install:
    desc: "Install required Go dev tools"
    cmds:
      - |
        if [ -f /volume1/Environments/use-menv.sh ]; then . /volume1/Environments/use-menv.sh >/dev/null 2>&1 || true; fi
        go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
        go install github.com/air-verse/air@latest
        go install golang.org/x/tools/cmd/goimports@latest
        go install github.com/segmentio/golines@latest
        go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
        go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest
    silent: false

  proto:gen:
    desc: "Generate gRPC & Protobuf code using buf"
    dir: "{{.PROTO_SRC_DIR}}"
    cmds:
      - buf dep update
      - buf generate
    sources:
      - "{{.PROTO_SRC_DIR}}/src/**/*.proto"
    generates:
      - "{{.PROTO_OUT_DIR}}/**/*.pb.go"

  lint:
    desc: "Run golangci-lint"
    cmds:
      - golangci-lint run --timeout=5m

  fmt:
    desc: "Format Go code (goimports + golines)"
    cmds:
      - goimports -w .
      - golines -m 160 -w .
    silent: true

  ci:
    desc: "Run all CI tasks (format, lint)"
    cmds:
      - task: fmt
      - task: lint

  errors:add-templates:
    desc: "Add i18n comment blocks to .go files in errors/src that lack them"
    cmds:
      - go run ./errors/cmd/add_templates/ {{.ERRORS_DIR}}

  errors:gen-langs:
    desc: "Generate errors/langs/*.json from translation blocks in errors/src"
    cmds:
      - go run ./errors/cmd/gen_langs/ {{.ERRORS_DIR}} {{.CLI_ARGS}}

  errors:gen-langs:prod:
    desc: "Generate errors/langs/*.json for production (*p* overrides)"
    cmds:
      - go run ./errors/cmd/gen_langs/ {{.ERRORS_DIR}} --prod

  errors:
    desc: "Errors: add missing i18n blocks then generate langs"
    cmds:
      - task: errors:add-templates
      - task: errors:gen-langs

  messages:gen-langs:
    desc: "Generate messages/langs/*.json from translation blocks in messages/src"
    cmds:
      - go run ./messages/cmd/gen_langs/ {{.MESSAGES_DIR}} {{.CLI_ARGS}}

  messages:
    desc: "Generate system-message / notification i18n JSON"
    cmds:
      - task: messages:gen-langs

  clean:
    desc: "Clean build artifacts"
    cmds:
      - rm -rf bin/

  redis:tunnel:
    desc: "Kill any stale Redis SSH tunnel, then prompt to open a fresh local-forward"
    interactive: true
    cmds:
      - bash scripts/redis_ssh_tunnel.sh --env-file {{.ENV_FILE}}

  redis:tunnel:down:
    desc: "Stop Redis SSH tunnel and remove .env.redis-tunnel"
    cmds:
      - bash scripts/redis_ssh_tunnel.sh --down

  console:
    desc: "Run console dev server"
    dir: console
    cmds:
      - npm run dev

  console:i:
    desc: "Install console dependencies"
    dir: console
    cmds:
      - npm install

  run:
    desc: "Build & start vault *-base (dev) or prod stack (secure). Requires NFX-Edge network {{.NETWORK}}."
    interactive: true
    cmds:
      - go run ./errors/cmd/gen_langs/ {{.ERRORS_DIR}} {{if eq .ENV "secure"}}--prod{{end}}
      - go run ./messages/cmd/gen_langs/ {{.MESSAGES_DIR}}
      - |
        echo "==> ensure docker network {{.NETWORK}}"
        if sudo docker network inspect {{.NETWORK}}; then
          echo "  network {{.NETWORK}} already exists"
        else
          echo "ERROR: Docker network {{.NETWORK}} missing. Start NFX-Edge first."
          exit 1
        fi
      - |
        ENV_FILE="{{.ENV_FILE}}"
        if [[ "{{.ENV}}" == "secure" && ! -f "$ENV_FILE" ]]; then
          ENV_FILE=".env"
        fi
        ENV_ARGS=(--env-file "$ENV_FILE")
        if [[ -f .env.redis-tunnel ]]; then
          ENV_ARGS+=(--env-file .env.redis-tunnel)
        fi
        if [[ "{{.ENV}}" == "secure" ]]; then
          echo "==> docker compose up (prod)"
          sudo docker compose "${ENV_ARGS[@]}" -f {{.APP_COMPOSE}} up -d --build
        else
          for svc in tls-base file-base analysis-base system-base dns-base; do
            echo "==> docker compose build $svc"
            sudo docker compose "${ENV_ARGS[@]}" -f {{.APP_COMPOSE}} build "$svc"
          done
          echo "==> docker compose up"
          sudo docker compose "${ENV_ARGS[@]}" -f {{.APP_COMPOSE}} up
        fi

  run:rebuild:
    desc: "Force-rebuild (--no-cache) vault services (ENV=dev|secure)."
    interactive: true
    cmds:
      - go run ./errors/cmd/gen_langs/ {{.ERRORS_DIR}} {{if eq .ENV "secure"}}--prod{{end}}
      - |
        echo "==> ensure docker network {{.NETWORK}}"
        if sudo docker network inspect {{.NETWORK}}; then
          echo "  network {{.NETWORK}} already exists"
        else
          echo "ERROR: Docker network {{.NETWORK}} missing. Start NFX-Edge first."
          exit 1
        fi
      - |
        ENV_FILE="{{.ENV_FILE}}"
        if [[ "{{.ENV}}" == "secure" && ! -f "$ENV_FILE" ]]; then
          ENV_FILE=".env"
        fi
        ENV_ARGS=(--env-file "$ENV_FILE")
        if [[ "{{.ENV}}" == "secure" ]]; then
          sudo docker compose "${ENV_ARGS[@]}" -f {{.APP_COMPOSE}} build --no-cache
          sudo docker compose "${ENV_ARGS[@]}" -f {{.APP_COMPOSE}} up -d
        else
          for svc in tls-base file-base analysis-base system-base dns-base; do
            echo "==> docker compose build --no-cache $svc"
            sudo docker compose "${ENV_ARGS[@]}" -f {{.APP_COMPOSE}} build --no-cache "$svc"
          done
          sudo docker compose "${ENV_ARGS[@]}" -f {{.APP_COMPOSE}} up
        fi

  run:down:
    desc: "Stop the app stack (ENV=dev|secure)"
    cmds:
      - |
        ENV_FILE="{{.ENV_FILE}}"
        if [[ "{{.ENV}}" == "secure" && ! -f "$ENV_FILE" ]]; then
          ENV_FILE=".env"
        fi
        sudo docker compose --env-file "$ENV_FILE" -f {{.APP_COMPOSE}} down

  atlas:gen-models:
    desc: "Generate Go models from the PostgreSQL schema (ENV=dev|secure)"
    dotenv:
      - "{{.ENV_FILE}}"
    cmds:
      - |
        export POSTGRES_USER="${POSTGRES_USER:-$POSTGRESQL_USER}"
        export POSTGRES_PASSWORD="${POSTGRES_PASSWORD:-$POSTGRESQL_PASSWORD}"
        export POSTGRES_HOST="${POSTGRES_HOST:-$POSTGRESQL_HOST}"
        export POSTGRES_PORT="${POSTGRES_PORT:-$POSTGRESQL_PORT}"
        if [[ "{{.ENV}}" == "secure" ]]; then
          export POSTGRES_DB="${POSTGRES_DB:-${POSTGRESQL_NAME:-$POSTGRESQL_NAME_PROD}}"
        else
          export POSTGRES_DB="${POSTGRES_DB:-${POSTGRESQL_NAME:-$POSTGRESQL_NAME_DEV}}"
        fi
        export POSTGRES_DB_SHADOW="${POSTGRES_DB_SHADOW:-${POSTGRESQL_NAME_SHADOW:-nfxvault_diff}}"
        export POSTGRES_SSLMODE="${POSTGRES_SSLMODE:-{{.POSTGRES_SSLMODE}}}"
        export ATLAS_ENV="${ATLAS_ENV:-{{.ENV}}}"
        bash databases/scripts/gen_models.sh
    silent: false

  atlas:gen-views:
    desc: "Generate Go views from the PostgreSQL schema (ENV=dev|secure)"
    dotenv:
      - "{{.ENV_FILE}}"
    cmds:
      - |
        export POSTGRES_USER="${POSTGRES_USER:-$POSTGRESQL_USER}"
        export POSTGRES_PASSWORD="${POSTGRES_PASSWORD:-$POSTGRESQL_PASSWORD}"
        export POSTGRES_HOST="${POSTGRES_HOST:-$POSTGRESQL_HOST}"
        export POSTGRES_PORT="${POSTGRES_PORT:-$POSTGRESQL_PORT}"
        if [[ "{{.ENV}}" == "secure" ]]; then
          export POSTGRES_DB="${POSTGRES_DB:-${POSTGRESQL_NAME:-$POSTGRESQL_NAME_PROD}}"
        else
          export POSTGRES_DB="${POSTGRES_DB:-${POSTGRESQL_NAME:-$POSTGRESQL_NAME_DEV}}"
        fi
        export POSTGRES_DB_SHADOW="${POSTGRES_DB_SHADOW:-${POSTGRESQL_NAME_SHADOW:-nfxvault_diff}}"
        export POSTGRES_SSLMODE="${POSTGRES_SSLMODE:-{{.POSTGRES_SSLMODE}}}"
        export ATLAS_ENV="${ATLAS_ENV:-{{.ENV}}}"
        bash databases/scripts/gen_views.sh
    silent: false

  atlas:gen-enums:
    desc: "Generate Go enums from the PostgreSQL schema (ENV=dev|secure)"
    dotenv:
      - "{{.ENV_FILE}}"
    cmds:
      - |
        export POSTGRES_USER="${POSTGRES_USER:-$POSTGRESQL_USER}"
        export POSTGRES_PASSWORD="${POSTGRES_PASSWORD:-$POSTGRESQL_PASSWORD}"
        export POSTGRES_HOST="${POSTGRES_HOST:-$POSTGRESQL_HOST}"
        export POSTGRES_PORT="${POSTGRES_PORT:-$POSTGRESQL_PORT}"
        if [[ "{{.ENV}}" == "secure" ]]; then
          export POSTGRES_DB="${POSTGRES_DB:-${POSTGRESQL_NAME:-$POSTGRESQL_NAME_PROD}}"
        else
          export POSTGRES_DB="${POSTGRES_DB:-${POSTGRESQL_NAME:-$POSTGRESQL_NAME_DEV}}"
        fi
        export POSTGRES_DB_SHADOW="${POSTGRES_DB_SHADOW:-${POSTGRESQL_NAME_SHADOW:-nfxvault_diff}}"
        export POSTGRES_SSLMODE="${POSTGRES_SSLMODE:-{{.POSTGRES_SSLMODE}}}"
        export ATLAS_ENV="${ATLAS_ENV:-{{.ENV}}}"
        bash databases/scripts/gen_enums.sh
    silent: false

  atlas:gen:
    desc: "Generate Go models, enums and views from the database schema (ENV=dev|secure)"
    cmds:
      - task: atlas:gen-enums
      - task: atlas:gen-models
      - task: atlas:gen-views
    silent: false

  atlas:status:
    desc: "Show Atlas migrate status (ENV=dev|secure)"
    dotenv:
      - "{{.ENV_FILE}}"
    cmds:
      - |
        export POSTGRES_USER="${POSTGRES_USER:-$POSTGRESQL_USER}"
        export POSTGRES_PASSWORD="${POSTGRES_PASSWORD:-$POSTGRESQL_PASSWORD}"
        export POSTGRES_HOST="${POSTGRES_HOST:-$POSTGRESQL_HOST}"
        export POSTGRES_PORT="${POSTGRES_PORT:-$POSTGRESQL_PORT}"
        if [[ "{{.ENV}}" == "secure" ]]; then
          export POSTGRES_DB_PROD="${POSTGRESQL_NAME_PROD:-nfxvault}"
          atlas migrate status --env prod --config file://databases/atlas.hcl --dir file://databases/migrations/production
        else
          export POSTGRES_DB_DEV="${POSTGRESQL_NAME_DEV:-nfxvault_dev}"
          export POSTGRES_DB_PROD="${POSTGRESQL_NAME_PROD:-nfxvault}"
          export POSTGRES_DB_SHADOW="${POSTGRESQL_NAME_SHADOW:-nfxvault_diff}"
          atlas migrate status --env dev --config file://databases/atlas.hcl --dir file://databases/migrations/development
        fi

  atlas:pipeline:run:
    desc: "Run Atlas pipeline (ENV=dev|secure; extra flags after --)"
    dotenv:
      - "{{.ENV_FILE}}"
    cmds:
      - |
        export POSTGRES_USER="${POSTGRES_USER:-$POSTGRESQL_USER}"
        export POSTGRES_PASSWORD="${POSTGRES_PASSWORD:-$POSTGRESQL_PASSWORD}"
        export POSTGRES_HOST="${POSTGRES_HOST:-$POSTGRESQL_HOST}"
        export POSTGRES_PORT="${POSTGRES_PORT:-$POSTGRESQL_PORT}"
        if [[ "{{.ENV}}" == "secure" ]]; then
          export POSTGRES_DB="${POSTGRES_DB:-${POSTGRESQL_NAME:-$POSTGRESQL_NAME_PROD}}"
        else
          export POSTGRES_DB="${POSTGRES_DB:-${POSTGRESQL_NAME:-$POSTGRESQL_NAME_DEV}}"
        fi
        export POSTGRES_DB_SHADOW="${POSTGRES_DB_SHADOW:-${POSTGRESQL_NAME_SHADOW:-nfxvault_diff}}"
        export POSTGRES_SSLMODE="${POSTGRES_SSLMODE:-{{.POSTGRES_SSLMODE}}}"
        export ATLAS_CONFIG_PATH="file://databases/atlas.hcl"
        bash run_atlas_pipeline.sh --{{.ENV}} {{.CLI_ARGS}}

  scripts:test-db:
    desc: "Probe PostgreSQL (+ Redis) connectivity for ENV=dev|secure."
    dotenv:
      - "{{.ENV_FILE}}"
    cmds:
      - ENV={{.ENV}} go run ./scripts/testdb/ {{.CLI_ARGS}}

  scripts:clear-data:
    desc: "Truncate all table data in dns/vault/system (dev only). Pass -- --yes to skip prompt."
    cmds:
      - go run ./scripts/cleardata/ {{.CLI_ARGS}}
